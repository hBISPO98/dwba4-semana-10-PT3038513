        <section class="topo">
            <img class="logo-if" src="img/Logo.jpg" alt="Logo IFSP">
        </section>

        <main class="principal contato">
            <section class="principal-menu">
                <div class="secao contato-secao">
                    <h1>Mande uma mensagem</h1>

                    <form action="">
                        <ul>
                            <li><label>Nome </label>
                            <input type="text" required></li>

                            <li><label>E-mail </label>
                            <input type="email" required></li>

                            <li><label>Telefone </label>
                            <input type="tel" placeholder="(99) 99999-9999" required></li>

                            <li><label for="assunto">Assunto </label>
                                <select name="assunto" id="assunto">
                                    <option value="">-- Selecione --</option>
                                    <option value="reclamacao">Reclamação</option>
                                    <option value="sugestao">Sugestão</option>
                                </select>
                            </li>

                            <li><label for="mensagem">Mensagem </label>
                            <textarea name="mensagem" id="mensagem"></textarea></li>

                            <li>
                                <fieldset>
                                    <legend>Opções de Resposta</legend>
                                    <label for="email"><input type="checkbox" id="email" name="resposta" value="email"> E-mail</label>
                                    <label for="telefone"><input type="checkbox" id="telefone" name="resposta" value="telefone"> Telefone</label>
                                </fieldset>
                            </li>

                            <li>
                                <button type="submit">Enviar</button>
                            </li>
                        </ul>
                    </form>
                </div>
            </section>
        </main>

        <footer class="rodape">
            <a class="rodape-rede" href="https://www.facebook.com/ifsppirituba/?locale=pt_BR">

            <p>IFSP - Câmpus Pirituba - Av. Mutinga, 951 - Jardim Santo Elias - CEP: 05110-000 - São Paulo/SP - Contato: (11) 2504-0100</p>
